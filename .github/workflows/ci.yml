name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BATS_REPO: https://github.com/bats-core/bats-core.git
  BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5   # v1.14.0

jobs:
  lint:
    name: shellcheck and bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      # bash -n on every script, shellcheck -x on the sources, and a
      # single-file build that is shellchecked on its own.
      - run: tests/lint.sh

  unit:
    name: unit tests (bats, ${{ matrix.target }} build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [modular, bundle]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bats-core (pinned)
        run: |
          git init -q tests/vendor/bats-core
          git -C tests/vendor/bats-core fetch -q --depth 1 "$BATS_REPO" "$BATS_COMMIT"
          git -C tests/vendor/bats-core checkout -q FETCH_HEAD
      # The same suite runs against bin/ (modular) and against a fresh
      # single-file build (bundle): both must behave the same.
      - run: tests/run.sh
        env:
          BATS: ${{ github.workspace }}/tests/vendor/bats-core/bin/bats
          CBS_TEST_TARGET: ${{ matrix.target }}

  bundle:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh dist/chromebrew-scripts
      - name: The single file runs on its own
        run: |
          dist/chromebrew-scripts --version
          dist/chromebrew-scripts --help >/dev/null
          dist/chromebrew-scripts rw --help >/dev/null
          dist/chromebrew-scripts --completion bash >/dev/null
          (cd dist && sha256sum chromebrew-scripts | tee chromebrew-scripts.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: chromebrew-scripts-single-file
          path: |
            dist/chromebrew-scripts
            dist/chromebrew-scripts.sha256

  # Real ChromeOS cannot run in CI. This job checks that install.sh and the
  # installed commands work on other distributions: the single file and its
  # symlinks are installed into a temporary prefix, every command plans its
  # dry run against a fake root (nothing on the machine is touched and sudo,
  # mount, reboot, make_dev_ssd.sh and crew are never called), --self-update
  # --dry-run runs against a local fake release, and the layouts are switched
  # and uninstalled. See tests/install-smoke.sh.
  install-smoke:
    name: install.sh in ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable-slim", "alpine:3"]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install bash, coreutils, tar and curl
        run: |
          if command -v apk >/dev/null; then
            apk add --no-cache bash coreutils tar curl
          else
            apt-get update -q && apt-get install -y -q --no-install-recommends bash curl ca-certificates
          fi
      - uses: actions/checkout@v4
      - run: bash tests/install-smoke.sh
